<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset class="form-group">
					<h1>Ваши личные данные</h1>
					<label class="label">
						Ваше имя
						<input type="text" placeholder="Имя" required class="input">
					</label>

					<label class="label">
						Ваш возраст
						<input type="number" placeholder="Возраст" required class="input">
					</label>

					<label class="label">
						Ваш номер телефона
						<input type="tel" placeholder="Номер телефона" required class="input">
					</label>

					<label class="label">
						Ваша почта
						<input type="email" placeholder="Почта" required class="input">
					</label>

					<label class="textarea">
						Сообщение
						<textarea placeholder="Ваше сообщение" required></textarea>
					</label>
					<div class="checkbox">
					<label>
					
						<input type="checkbox" required>
						Я принимаю условия
					</label>
					</div>
					<div class="button">
						<button>Отправить</button>
				</div>
						</fieldset>

		</form>
</body>
</html>
